<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Awesome Website</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-color: #0a0b10;
      --card-bg: rgba(30, 32, 40, 0.6);
      --card-border: rgba(255, 255, 255, 0.08);
      --text-primary: #e0e0e0;
      --text-secondary: #a0a0a0;
      --accent-color: #00f2ff;
      --accent-glow: rgba(0, 242, 255, 0.3);
      --hover-bg: rgba(255, 255, 255, 0.05);
      --tag-bg: rgba(255, 255, 255, 0.05);
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      margin: 0;
      padding: 0;
      background-color: var(--bg-color);
      color: var(--text-primary);
      background-image:
        linear-gradient(rgba(10, 11, 16, 0.9), rgba(10, 11, 16, 0.9)),
        linear-gradient(0deg, transparent 24%, rgba(255, 255, 255, .03) 25%, rgba(255, 255, 255, .03) 26%, transparent 27%, transparent 74%, rgba(255, 255, 255, .03) 75%, rgba(255, 255, 255, .03) 76%, transparent 77%, transparent),
        linear-gradient(90deg, transparent 24%, rgba(255, 255, 255, .03) 25%, rgba(255, 255, 255, .03) 26%, transparent 27%, transparent 74%, rgba(255, 255, 255, .03) 75%, rgba(255, 255, 255, .03) 76%, transparent 77%, transparent);
      background-size: 100% 100%, 50px 50px, 50px 50px;
      min-height: 100vh;
      animation: bgScroll 60s linear infinite;
    }

    @keyframes bgScroll {
      from { background-position: 0 0, 0 0, 0 0; }
      to { background-position: 0 0, 0 50px, 50px 0; }
    }

    .container {
      max-width: 1000px;
      margin: 0 auto;
      padding: 40px 20px;
    }

    h1 {
      font-size: 2.5em;
      text-align: center;
      margin-bottom: 30px;
      font-weight: 700;
      background: linear-gradient(90deg, #fff, var(--accent-color), #fff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-size: 200% auto;
      animation: shine 3s linear infinite;
    }

    @keyframes shine {
      to { background-position: 200% center; }
    }

    .search-container {
      position: relative;
      margin: 0 auto 30px;
      max-width: 600px;
    }

    #search-input {
      width: 100%;
      padding: 18px 25px;
      font-size: 1.1em;
      border-radius: 30px;
      border: 1px solid var(--accent-color);
      background: rgba(10, 11, 16, 0.8);
      color: #fff;
      backdrop-filter: blur(10px);
      box-shadow: 0 0 20px var(--accent-glow);
      outline: none;
      box-sizing: border-box;
      transition: all 0.3s ease;
    }

    #search-input:focus {
      box-shadow: 0 0 30px rgba(0, 242, 255, 0.6);
    }
    
    .candidates {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: center;
      margin-top: 15px;
      min-height: 40px;
    }

    .tag-cloud {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      justify-content: center;
      align-items: center;
      margin-bottom: 40px;
    }

    .tag {
      padding: 8px 16px;
      background: var(--tag-bg);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      color: var(--text-secondary);
      font-size: 0.9em;
      cursor: pointer;
      transition: all 0.3s ease;
      backdrop-filter: blur(5px);
    }

    .tag:hover, .tag.active {
      background: var(--accent-color);
      color: #0a0b10;
      box-shadow: 0 0 15px var(--accent-glow);
      border-color: var(--accent-color);
      font-weight: 600;
    }

    .results-container {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 20px;
    }

    .card {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      padding: 20px 15px;
      background-color: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      height: 120px;
      text-align: center;
      backdrop-filter: blur(10px);
      position: relative;
    }

    .card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: radial-gradient(circle at center, var(--accent-glow), transparent 70%);
      opacity: 0;
      transition: opacity 0.4s;
      border-radius: 16px;
    }

    .card:hover {
      transform: translateY(-5px) scale(1.02);
      border-color: var(--accent-color);
      box-shadow: 0 10px 40px -10px var(--accent-glow);
      z-index: 10;
    }

    .card:hover::before { opacity: 0.4; }

    .card img {
      width: 44px;
      height: 44px;
      margin-bottom: 15px;
      border-radius: 10px;
      transition: transform 0.4s ease;
      filter: drop-shadow(0 4px 8px rgba(0,0,0,0.3));
      position: relative;
      z-index: 2;
    }

    .card:hover img {
      transform: scale(1.1) rotate(5deg);
    }

    .card span.name {
      color: var(--text-primary);
      font-size: 14px;
      font-weight: 500;
      position: relative;
      z-index: 2;
      max-width: 140px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    
    .card span.tags {
      color: var(--text-secondary);
      font-size: 11px;
      margin-top: 8px;
      position: relative;
      z-index: 2;
      opacity: 0.7;
    }

    .hidden {
      display: none !important;
    }
    
    .empty-state {
        grid-column: 1 / -1;
        text-align: center;
        padding: 40px;
        color: var(--text-secondary);
        font-size: 1.1em;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Awesome Website</h1>
    
    <div class="search-container">
      <input type="text" id="search-input" placeholder="搜索标签或名称..." autocomplete="off">
      <div id="candidates" class="candidates"></div>
    </div>

    <div id="tag-cloud" class="tag-cloud"></div>
    <div id="results" class="results-container"></div>
  </div>

  <script src="bookmarks.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      let data = [];
      if (typeof window.bookmarksData !== 'undefined') {
        data = window.bookmarksData;
      } else if (typeof bookmarksData !== 'undefined') {
        data = bookmarksData;
      } else {
        document.body.innerHTML = '<h2 style="color:red;text-align:center;">加载书签数据失败，请检查 bookmarks.js</h2>';
        return;
      }
      
      const tagsMap = new Map();
      
      // Calculate frequency of tags
      data.forEach(item => {
        const tags = item.tags || [];
        tags.forEach(tag => {
          tagsMap.set(tag, (tagsMap.get(tag) || 0) + 1);
        });
      });
      
      const allTags = Array.from(tagsMap.entries())
        .map(([tag, count]) => ({tag, count}))
        .sort((a, b) => b.count - a.count); // sort by freq
        
      const resultsContainer = document.getElementById('results');
      const searchInput = document.getElementById('search-input');
      const candidatesContainer = document.getElementById('candidates');
      const tagCloudContainer = document.getElementById('tag-cloud');
      
      let activeTags = new Set();
      
      // Render all tags initially in cloud
      function renderTagCloud() {
        tagCloudContainer.innerHTML = '';
        if (allTags.length === 0) return;
        
        // 只取出现频率最高的前 100 个标签构建词云
        const topTags = allTags.slice(0, 100);
        
        const maxCount = topTags[0].count;
        const minCount = topTags[topTags.length - 1].count;
        
        // 打乱标签顺序以实现更好的词云视觉效果
        const displayTags = [...topTags].sort(() => Math.random() - 0.5);
        
        displayTags.forEach(t => {
          const btn = document.createElement('div');
          btn.className = 'tag';
          btn.textContent = t.tag;
          
          let fontSize = 0.8;
          if (maxCount > minCount) {
            // 根据数量计算字体大小 (在 0.8em 到 2.2em 之间)
            fontSize = 0.8 + (1.4 * ((t.count - minCount) / (maxCount - minCount)));
          }
          btn.style.fontSize = `${fontSize}em`;
          btn.style.padding = `0.4em 0.8em`; // 使内边距随字体大小缩放
          
          btn.onclick = () => toggleTag(t.tag);
          tagCloudContainer.appendChild(btn);
        });
      }
      
      function toggleTag(tag) {
        if(activeTags.has(tag)) {
            activeTags.delete(tag);
        } else {
            activeTags.clear();
            activeTags.add(tag);
            searchInput.value = '';
            candidatesContainer.innerHTML = '';
        }
        updateUI();
      }

      function fuzzyMatch(str, query) {
        if (!str || !query) return 0;
        str = str.toLowerCase();
        query = query.toLowerCase();
        if (str === query) return 100;
        if (str.includes(query)) return 10;
        
        let score = 0;
        let strIdx = 0;
        for (let i = 0; i < query.length; i++) {
            const index = str.indexOf(query[i], strIdx);
            if (index !== -1) {
                score += 1;
                strIdx = index + 1;
            } else {
                return 0; // not found in sequence
            }
        }
        return score;
      }
      
      function handleSearch() {
        activeTags.clear();
        const query = searchInput.value.trim();
        
        if(!query) {
          candidatesContainer.innerHTML = '';
          tagCloudContainer.classList.remove('hidden');
          updateUI(true);
          return;
        }
        
        tagCloudContainer.classList.add('hidden');
        
        // Find matching tags
        const scoredTags = allTags.map(t => {
          return { tag: t.tag, score: fuzzyMatch(t.tag, query) };
        }).filter(t => t.score > 0);
        
        scoredTags.sort((a, b) => b.score - a.score);
        
        candidatesContainer.innerHTML = '';
        const topCandidates = scoredTags.slice(0, 10);
        
        // Add candidates below search bar
        topCandidates.forEach(cand => {
          const btn = document.createElement('div');
          btn.className = 'tag';
          btn.textContent = cand.tag;
          btn.onclick = () => {
            activeTags.clear();
            activeTags.add(cand.tag);
            searchInput.value = cand.tag;
            handleSearch();
          };
          candidatesContainer.appendChild(btn);
        });
        
        renderLinksByQueryAndTags(query, topCandidates.map(c => c.tag));
      }
      
      function renderLinksByQueryAndTags(query, candidateTagNames) {
        resultsContainer.innerHTML = '';
        const matchSet = new Set();
        
        data.forEach(item => {
          let score = fuzzyMatch(item.name, query);
          
          if (score > 0) {
              matchSet.add(item);
          } else if ((item.tags || []).some(t => fuzzyMatch(t, query) > 0)) {
              matchSet.add(item);
          }
        });
        
        const matchedItems = Array.from(matchSet);
        if (matchedItems.length === 0) {
            resultsContainer.innerHTML = '<div class="empty-state">没有找到匹配的书签</div>';
            return;
        }
        
        matchedItems.forEach(item => {
          resultsContainer.appendChild(createCard(item));
        });
      }
      
      // Used by tag clicks from the main tag cloud
      function updateUI(initial = false) {
        if (initial) {
          resultsContainer.innerHTML = '';
        }
        
        document.querySelectorAll('#tag-cloud .tag').forEach(el => {
          if(activeTags.has(el.textContent)) el.classList.add('active');
          else el.classList.remove('active');
        });
        
        if (initial) return;
        
        resultsContainer.innerHTML = '';
        const activeTag = Array.from(activeTags)[0];
        
        if(!activeTag) return;
        
        let counter = 0;
        data.forEach(item => {
          if((item.tags || []).includes(activeTag)) {
             resultsContainer.appendChild(createCard(item));
             counter++;
          }
        });
        
        if (counter === 0) {
            resultsContainer.innerHTML = '<div class="empty-state">没有找到在这标签下的书签</div>';
        }
      }
      
      function createCard(item) {
        const a = document.createElement('a');
        a.className = 'card';
        a.href = item.url;
        a.target = '_blank';
        
        const img = document.createElement('img');
        try {
          const domain = new URL(item.url).hostname;
          img.src = `https://t2.gstatic.com/faviconV2?client=SOCIAL&type=FAVICON&fallback_opts=TYPE,SIZE,URL&url=http://${domain}&size=64`;
          img.onerror = () => {
             img.src = 'data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIzMiIgaGVpZ2h0PSIzMiIgdmlld0JveD0iMCAwIDI0IDI0Ij48cGF0aCBmaWxsPSIjNTU1IiBkPSJNMTAgNHYyYTggOCAwIDAgMCA4IDhoMmExMCAxMCAwIDAgMS0xMCAxMFY0Wm0xMC4wMDggMi44MjhsMS40MTQgMS40MTRMMTUuNTU0IDEybDEuNDM4IDIuNzU4bC0yLjg1NyAyLjM5OEwxMyAxMy41VjExbDIuMDA4LS43MTRZTTMuOTkyIDQuMjIybC0xLjQxNCAxLjQxNEw4LjQ0NiAxMmwzLjU2MiA2LjQ2MWwyLjg1Ny0yLjM5OEw5IDEwLjVWMTNMLTIuMDA4LjcxNFoiLz48L3N2Zz4=';
          };
        } catch(e) {}
        
        const name = document.createElement('span');
        name.className = 'name';
        name.textContent = item.name;

        const tags = document.createElement('span');
        tags.className = 'tags';
        tags.textContent = (item.tags || []).slice(0, 3).join(' • ');

        a.appendChild(img);
        a.appendChild(name);
        a.appendChild(tags);
        return a;
      }
      
      searchInput.addEventListener('input', handleSearch);
      
      renderTagCloud();
      updateUI(true);
    });
  </script>
</body>
</html>
